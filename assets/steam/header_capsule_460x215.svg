<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215" width="460" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0612"/>
      <stop offset="50%" stop-color="#240c42"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="460" height="215" fill="url(#bg)"/>
  
  <!-- Sparks & Grid Lines -->
  <path d="M0 40 L460 40 M0 175 L460 175 M115 0 L115 215 M345 0 L345 215" stroke="rgba(34,211,238,0.15)" stroke-width="1"/>
  <path d="M-20 180 Q 230 40 480 180" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>

  <!-- Doge Mascot Graphic -->
  <g transform="translate(60, 105)">
    <circle cx="0" cy="0" r="45" fill="#f43f5e" opacity="0.2"/>
    <text x="0" y="24" font-size="64" text-anchor="middle" font-family="sans-serif">🐕</text>
  </g>

  <!-- Anvil Graphic -->
  <g transform="translate(390, 85)">
    <circle cx="0" cy="0" r="35" fill="#22d3ee" opacity="0.2"/>
    <text x="0" y="16" font-size="44" text-anchor="middle" font-family="sans-serif">🔨</text>
  </g>

  <!-- Title & Tagline -->
  <text x="235" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="url(#neon)" text-anchor="middle" letter-spacing="-1">Meme@Me</text>
  <rect x="130" y="115" width="210" height="26" rx="13" fill="#22d3ee"/>
  <text x="235" y="133" font-family="'Courier New', monospace" font-weight="900" font-size="12" fill="#0a0612" text-anchor="middle" letter-spacing="1">THE REVENGE SIMULATOR</text>

  <!-- Steam Bottom Badge -->
  <text x="235" y="185" font-family="'Courier New', monospace" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">TWITCH REVENGE META-GAME</text>
</svg>
