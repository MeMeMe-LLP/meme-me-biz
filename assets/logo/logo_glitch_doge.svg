<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="neon_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glitch_filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.95" numOctaves="1" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="500" height="500" rx="100" fill="#0a0612"/>
  <circle cx="250" cy="210" r="160" fill="#1b0a33" stroke="#22d3ee" stroke-width="6"/>

  <!-- Glitch Doge Center -->
  <g transform="translate(250, 210)" filter="url(#glitch_filter)">
    <text x="0" y="70" font-size="190" text-anchor="middle" font-family="sans-serif">🐕</text>
  </g>

  <!-- Glitch Pills -->
  <rect x="300" y="100" width="100" height="24" rx="6" fill="#22d3ee" transform="rotate(8 300 100)"/>
  <text x="350" y="117" font-family="monospace" font-weight="900" font-size="12" fill="#0a0612" text-anchor="middle" transform="rotate(8 300 100)">glitch.exe</text>

  <!-- Brand Typography -->
  <text x="250" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="56" fill="url(#neon_grad)" text-anchor="middle" letter-spacing="-1">Meme@Me</text>
  <text x="250" y="460" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#22d3ee" text-anchor="middle" letter-spacing="3">CHAOS ENGINE</text>
</svg>
